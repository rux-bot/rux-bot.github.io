<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D场景编辑器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; height: 100vh; }
    #app { display: flex; height: 100vh; }

    /* === 左侧面板 === */
    .left-panel { width: 240px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; flex-shrink: 0; }
    .panel-header { padding: 14px; background: #0f3460; font-size: 13px; font-weight: bold; border-bottom: 1px solid #1a1a4e; user-select: none; }
    .panel-content { flex: 1; overflow-y: auto; padding: 8px; }
    .category { margin-bottom: 12px; }
    .category-title { font-size: 11px; color: #666; margin-bottom: 6px; padding-left: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .item-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .item-card { background: #1a1a4e; border: 1px solid #2a2a6e; border-radius: 6px; padding: 8px 4px; cursor: pointer; transition: all 0.2s; text-align: center; user-select: none; }
    .item-card:hover { background: #2a2a6e; border-color: #4a4a8e; transform: translateY(-1px); }
    .item-icon { font-size: 22px; margin-bottom: 2px; }
    .item-name { font-size: 9px; color: #aaa; }

    /* === 3D视口 === */
    .viewport { flex: 1; position: relative; background: #0a0a1a; }
    #canvas3d { width: 100%; height: 100%; display: block; }

    /* === 工具栏 === */
    .toolbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(22,33,62,0.93); padding: 6px 10px; border-radius: 8px; border: 1px solid #0f3460; }
    .tool-btn { width: 32px; height: 32px; background: #1a1a4e; border: 1px solid #2a2a6e; border-radius: 5px; color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; }
    .tool-btn:hover { background: #2a2a6e; color: #fff; }
    .tool-btn.active { background: #00d4ff; color: #000; border-color: #00d4ff; }

    /* === 状态栏 === */
    .status-bar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(22,33,62,0.93); padding: 5px 14px; border-radius: 5px; border: 1px solid #0f3460; font-size: 10px; color: #666; }

    /* === 右侧面板 === */
    .right-panel { width: 280px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    .section { padding: 10px 12px; border-bottom: 1px solid #0f3460; }
    .section-title { font-size: 11px; color: #00d4ff; margin-bottom: 8px; font-weight: bold; }
    .no-sel { padding: 20px; text-align: center; color: #555; font-size: 11px; line-height: 1.8; }

    /* 属性行：[-] [slider] [input] [+] */
    .prop-row { display: flex; align-items: center; margin-bottom: 5px; gap: 3px; }
    .prop-label { width: 22px; font-size: 10px; color: #888; font-weight: bold; flex-shrink: 0; }
    .prop-slider { flex: 1; -webkit-appearance: none; height: 3px; background: #2a2a6e; border-radius: 2px; outline: none; min-width: 0; }
    .prop-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #00d4ff; border-radius: 50%; cursor: pointer; }
    .prop-input { width: 52px; background: #0a0a2e; border: 1px solid #2a2a6e; border-radius: 3px; padding: 3px 4px; color: #eee; font-size: 11px; outline: none; text-align: right; flex-shrink: 0; }
    .prop-input:focus { border-color: #00d4ff; }
    .prop-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* +/- 按钮 */
    .step-btn { width: 20px; height: 20px; background: #1a1a4e; border: 1px solid #2a2a6e; border-radius: 3px; color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; transition: all 0.12s; flex-shrink: 0; line-height: 1; }
    .step-btn:hover { background: #2a2a6e; color: #00d4ff; border-color: #00d4ff; }
    .step-btn:active { background: #00d4ff; color: #000; }

    /* 姿势选择 */
    .pose-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
    .pose-btn { background: #1a1a4e; border: 1px solid #2a2a6e; border-radius: 4px; padding: 5px 2px; cursor: pointer; text-align: center; font-size: 9px; color: #aaa; transition: all 0.15s; }
    .pose-btn:hover { background: #2a2a6e; }
    .pose-btn.active { background: #0a2a4e; border-color: #00d4ff; color: #00d4ff; }

    /* 颜色 */
    .color-row { display: flex; align-items: center; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .color-swatch { width: 22px; height: 22px; border-radius: 3px; border: 2px solid #2a2a6e; cursor: pointer; transition: border-color 0.15s; }
    .color-swatch:hover, .color-swatch.active { border-color: #00d4ff; }

    /* 按钮 */
    .btn { padding: 7px; border: none; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.15s; width: 100%; }
    .btn-export { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #000; }
    .btn-export:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,212,255,0.3); }
    .btn-delete { background: #cc3333; color: #fff; }
    .btn-delete:hover { background: #ee4444; }
    .btn-dup { background: #0099cc; color: #fff; }
    .btn-dup:hover { background: #00aadd; }

    /* 对象列表 */
    .obj-list { max-height: 160px; overflow-y: auto; }
    .obj-item { padding: 4px 8px; cursor: pointer; font-size: 10px; border-bottom: 1px solid #0a0a2e; display: flex; align-items: center; gap: 6px; transition: background 0.1s; }
    .obj-item:hover { background: #1a1a4e; }
    .obj-item.selected { background: #0a2a4e; color: #00d4ff; }
    .obj-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a2e; }
    ::-webkit-scrollbar-thumb { background: #2a2a6e; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 左侧 -->
    <div class="left-panel">
      <div class="panel-header">📦 对象库</div>
      <div class="panel-content">
        <div class="category">
          <div class="category-title">假人</div>
          <div class="item-grid">
            <div class="item-card" onclick="addDummyFromPanel('standing')"><div class="item-icon">🧍</div><div class="item-name">站立</div></div>
            <div class="item-card" onclick="addDummyFromPanel('sitting')"><div class="item-icon">🪑</div><div class="item-name">坐姿</div></div>
            <div class="item-card" onclick="addDummyFromPanel('lying')"><div class="item-icon">🛏️</div><div class="item-name">躺姿</div></div>
            <div class="item-card" onclick="addDummyFromPanel('squatting')"><div class="item-icon">🧎</div><div class="item-name">蹲姿</div></div>
            <div class="item-card" onclick="addDummyFromPanel('bending')"><div class="item-icon">🙇</div><div class="item-name">弯腰</div></div>
            <div class="item-card" onclick="addDummyFromPanel('walking')"><div class="item-icon">🚶</div><div class="item-name">行走</div></div>
          </div>
        </div>
        <div class="category">
          <div class="category-title">立体图形</div>
          <div class="item-grid-3">
            <div class="item-card" onclick="addShape('box')"><div class="item-icon">🟦</div><div class="item-name">长方体</div></div>
            <div class="item-card" onclick="addShape('sphere')"><div class="item-icon">🔵</div><div class="item-name">球体</div></div>
            <div class="item-card" onclick="addShape('cylinder')"><div class="item-icon">🧪</div><div class="item-name">圆柱</div></div>
            <div class="item-card" onclick="addShape('cone')"><div class="item-icon">🔺</div><div class="item-name">圆锥</div></div>
            <div class="item-card" onclick="addShape('torus')"><div class="item-icon">🍩</div><div class="item-name">圆环</div></div>
            <div class="item-card" onclick="addShape('pyramid')"><div class="item-icon">📐</div><div class="item-name">棱锥</div></div>
            <div class="item-card" onclick="addShape('wedge')"><div class="item-icon">◣</div><div class="item-name">楔体</div></div>
            <div class="item-card" onclick="addShape('capsule')"><div class="item-icon">💊</div><div class="item-name">胶囊</div></div>
            <div class="item-card" onclick="addShape('diamond')"><div class="item-icon">💎</div><div class="item-name">菱形</div></div>
          </div>
        </div>
        <div class="category">
          <div class="category-title">建筑</div>
          <div class="item-grid">
            <div class="item-card" onclick="addBuilding('house')"><div class="item-icon">🏠</div><div class="item-name">房屋</div></div>
            <div class="item-card" onclick="addBuilding('tower')"><div class="item-icon">🏢</div><div class="item-name">高楼</div></div>
            <div class="item-card" onclick="addBuilding('warehouse')"><div class="item-icon">🏭</div><div class="item-name">仓库</div></div>
            <div class="item-card" onclick="addBuilding('pavilion')"><div class="item-icon">⛩️</div><div class="item-name">亭子</div></div>
            <div class="item-card" onclick="addBuilding('wall')"><div class="item-icon">🧱</div><div class="item-name">围墙</div></div>
            <div class="item-card" onclick="addBuilding('gate')"><div class="item-icon">🏛️</div><div class="item-name">大门</div></div>
          </div>
        </div>
        <div class="category">
          <div class="category-title">场景</div>
          <div class="item-grid">
            <div class="item-card" onclick="addObject('tree')"><div class="item-icon">🌳</div><div class="item-name">树木</div></div>
            <div class="item-card" onclick="addObject('car')"><div class="item-icon">🚗</div><div class="item-name">汽车</div></div>
            <div class="item-card" onclick="addObject('bench')"><div class="item-icon">💺</div><div class="item-name">长椅</div></div>
            <div class="item-card" onclick="addObject('lamp')"><div class="item-icon">💡</div><div class="item-name">路灯</div></div>
            <div class="item-card" onclick="addObject('table')"><div class="item-icon">🪑</div><div class="item-name">桌子</div></div>
            <div class="item-card" onclick="addObject('chair')"><div class="item-icon">💺</div><div class="item-name">椅子</div></div>
            <div class="item-card" onclick="addObject('bookshelf')"><div class="item-icon">📚</div><div class="item-name">书架</div></div>
            <div class="item-card" onclick="addObject('fence')"><div class="item-icon">🏗️</div><div class="item-name">栅栏</div></div>
            <div class="item-card" onclick="addObject('box')"><div class="item-icon">📦</div><div class="item-name">箱子</div></div>
            <div class="item-card" onclick="addObject('trashcan')"><div class="item-icon">🗑️</div><div class="item-name">垃圾桶</div></div>
            <div class="item-card" onclick="addObject('flowerbed')"><div class="item-icon">🌺</div><div class="item-name">花坛</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3D视口 -->
    <div class="viewport" id="viewport">
      <canvas id="canvas3d"></canvas>
      <div class="toolbar">
        <button class="tool-btn active" id="btnSelect" title="选择 (Q)" onclick="setMode('select')">🖱️</button>
        <button class="tool-btn" id="btnMove" title="移动 (W)" onclick="setMode('translate')">✥</button>
        <button class="tool-btn" id="btnRotate" title="旋转 (E)" onclick="setMode('rotate')">🔄</button>
        <button class="tool-btn" id="btnScale" title="缩放 (R)" onclick="setMode('scale')">⤡</button>
        <button class="tool-btn" id="btnReset" title="重置视角" onclick="resetCamera()">🎯</button>
        <button class="tool-btn" id="btnTop" title="俯视图" onclick="topView()">⬇️</button>
      </div>
      <div class="status-bar"><span id="statusText">就绪 | 左键旋转视角 | 左键点击选择 | 中键平移 | 滚轮缩放</span></div>
    </div>

    <!-- 右侧 -->
    <div class="right-panel">
      <div class="panel-header">⚙️ 属性面板</div>
      <div id="propPanel"><div class="no-sel">点击左侧添加物体<br>选中后编辑属性</div></div>

      <div class="section">
        <div class="section-title">📋 场景对象</div>
        <div class="obj-list" id="objList"></div>
      </div>
      <div style="flex:1;"></div>
      <div class="section" style="border-bottom:none;">
        <button class="btn btn-export" onclick="exportView()">📷 导出二维平面图</button>
      </div>
    </div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <script src="lib/TransformControls.js"></script>
  <script src="app.js"></script>
</body>
</html>
